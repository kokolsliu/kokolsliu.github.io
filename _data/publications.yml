- title: "A design of auxetic metamaterial with locally resonant bandgaps using topological optimization"
  url: "https://doi.org/10.1142/s1758825123500485"
  authors: "Liu, L., & Lee, H. P"
  venue: "International Journal of Applied Mechanics, 15(6)"
  year: 2023
  image: "/assets/pubs/Auxetic.png"
  summary: "We employed topology optimization with the SIMP method and MMA optimizer for the design of auxetic metamaterials. The negative Poisson’s ratio was verified by numerical simulation.
            Bandgap study was also conducted on the optimized layout and it showed that the optimization also achieved auxetic metamaterials with two narrow locally resonant bandgaps in addition 
            to broadening and lowering the bandgap of the initial configuration."



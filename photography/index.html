title: Photography
permalink: /photography/

<h1>Photography</h1>

<form id="photo-gate" class="photo-gate" autocomplete="off">
  <p>This gallery is password protected.</p>
  <div class="photo-gate-row">
    <input id="photo-gate-input" type="password" placeholder="Password" aria-label="Password" required>
    <button type="submit">Enter</button>
  </div>
  <p class="photo-gate-hint">Hint: my girlfriend's name</p>
  <p id="photo-gate-error" class="photo-gate-error" hidden>Incorrect password.</p>
</form>

<div id="masonry" class="masonry" hidden></div>

<!-- Gallery markup lives in a template so no photos load until unlocked. -->
<template id="masonry-template">
  {% assign imgs = site.static_files | where_exp: "f", "f.path contains '/assets/photos/'" %}
  {% for img in imgs %}
    {% assign ext = img.extname | downcase %}
    {% if ext == '.jpg' or ext == '.jpeg' or ext == '.png' or ext == '.webp' or ext == '.gif' %}
      <a class="brick" href="{{ img.path | relative_url }}" target="_blank" rel="noopener">
        <img loading="lazy" src="{{ img.path | relative_url }}" alt="">
      </a>
    {% endif %}
  {% endfor %}
</template>

<script>
  (function () {
    // SHA-256 of the password (input is trimmed and lowercased before hashing).
    const HASH = "56e1239485139d3d0564c10a8cb8e7dbb6c75b2d744d49073d07c4208f7b7941";
    const KEY = "photography-unlocked";

    const form = document.getElementById("photo-gate");
    const input = document.getElementById("photo-gate-input");
    const error = document.getElementById("photo-gate-error");
    const container = document.getElementById("masonry");
    const tpl = document.getElementById("masonry-template");

    function showGallery() {
      container.appendChild(tpl.content.cloneNode(true));

      // Shuffle items to get a random dense layout each load (Fisher–Yates).
      const items = Array.from(container.children);
      for (let i = items.length - 1; i > 0; i--) {
        const j = Math.floor(Math.random() * (i + 1));
        [items[i], items[j]] = [items[j], items[i]];
      }
      items.forEach(el => container.appendChild(el));

      form.hidden = true;
      container.hidden = false;
    }

    async function sha256(text) {
      const buf = await crypto.subtle.digest("SHA-256", new TextEncoder().encode(text));
      return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, "0")).join("");
    }

    try {
      if (sessionStorage.getItem(KEY) === "1") { showGallery(); return; }
    } catch (e) {}

    form.addEventListener("submit", async function (e) {
      e.preventDefault();
      if (await sha256(input.value.trim().toLowerCase()) === HASH) {
        try { sessionStorage.setItem(KEY, "1"); } catch (e) {}
        showGallery();
      } else {
        error.hidden = false;
        input.select();
      }
    });
  })();
</script>
